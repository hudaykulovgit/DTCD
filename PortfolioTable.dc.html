<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/expo-style-dashboard-design-system-2956c4ad-5a6b-4b67-95a9-899ada99c826/tokens/colors.css">
<link rel="stylesheet" href="_ds/expo-style-dashboard-design-system-2956c4ad-5a6b-4b67-95a9-899ada99c826/tokens/typography.css">
<link rel="stylesheet" href="_ds/expo-style-dashboard-design-system-2956c4ad-5a6b-4b67-95a9-899ada99c826/tokens/spacing.css">
<link rel="stylesheet" href="_ds/expo-style-dashboard-design-system-2956c4ad-5a6b-4b67-95a9-899ada99c826/tokens/radius.css">
<link rel="stylesheet" href="_ds/expo-style-dashboard-design-system-2956c4ad-5a6b-4b67-95a9-899ada99c826/tokens/fonts.css">
<script src="_ds/expo-style-dashboard-design-system-2956c4ad-5a6b-4b67-95a9-899ada99c826/_ds_bundle.js"></script>
</helmet>
<table style="width:100%;font-size:13px">
<thead><tr>
<th class="type-caption-upper" style="text-align:left;padding:10px 12px;border-bottom:1px solid var(--border-strong)">Проект</th>
<th class="type-caption-upper" style="text-align:left;padding:10px 12px;border-bottom:1px solid var(--border-strong)">Бюджет и факт, млн сум</th>
<th class="type-caption-upper" style="text-align:right;padding:10px 12px;border-bottom:1px solid var(--border-strong)">Потребность на 2027, млн сум</th>
</tr></thead>
<tbody>
<sc-for list="{{ data }}" as="prow" hint-placeholder-count="7">
<tr style-hover="background:var(--bg-canvas-soft)">
<td style="padding:14px 12px;border-bottom:1px solid var(--border-default)"><button onClick="{{ prow.onOpen }}" style="background:transparent;border:none;padding:0;color:var(--text-link);cursor:pointer;font:inherit;text-align:left;display:block">{{ prow.name }}</button><span class="type-caption" style="color:var(--text-muted)">{{ prow.type }}</span></td>
<td style="padding:14px 12px;border-bottom:1px solid var(--border-default);min-width:260px">
<div style="display:flex;align-items:center;gap:10px">
<div style="position:relative;width:180px;height:16px;flex-shrink:0;background:var(--color-sky-light);border-radius:4px">
<div style="position:absolute;left:0;top:0;height:100%;background:var(--color-text-link);border-radius:4px;width:{{ prow.paidBarPct }}"></div>
</div>
<span class="type-body-sm" style="font-variant-numeric:tabular-nums;white-space:nowrap"><strong>{{ prow.paid }}</strong> <span style="color:var(--text-muted)">/ {{ prow.plan }}</span></span>
</div>
</td>
<td class="type-body-sm" style="text-align:right;padding:14px 12px;border-bottom:1px solid var(--border-default);font-variant-numeric:tabular-nums">
<div style="display:flex;align-items:center;gap:8px;justify-content:flex-end">
<span>{{ prow.future }}</span>
<x-import component-from-global-scope="ExpoStyleDashboardDesignSystem_2956c4.Badge" variant="{{ prow.deltaVariant }}" hint-size="auto,22px">{{ prow.deltaLabel }}</x-import>
</div>
</td>
</tr>
</sc-for>
</tbody>
</table>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;data&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;any&quot;}}"></script>
</body>
</html>
