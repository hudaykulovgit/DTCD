<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/expo-style-dashboard-design-system-2956c4ad-5a6b-4b67-95a9-899ada99c826/tokens/colors.css">
<link rel="stylesheet" href="_ds/expo-style-dashboard-design-system-2956c4ad-5a6b-4b67-95a9-899ada99c826/tokens/typography.css">
<link rel="stylesheet" href="_ds/expo-style-dashboard-design-system-2956c4ad-5a6b-4b67-95a9-899ada99c826/tokens/spacing.css">
<link rel="stylesheet" href="_ds/expo-style-dashboard-design-system-2956c4ad-5a6b-4b67-95a9-899ada99c826/tokens/radius.css">
<link rel="stylesheet" href="_ds/expo-style-dashboard-design-system-2956c4ad-5a6b-4b67-95a9-899ada99c826/tokens/fonts.css">
<script src="_ds/expo-style-dashboard-design-system-2956c4ad-5a6b-4b67-95a9-899ada99c826/_ds_bundle.js"></script>
</helmet>
<table style="width:100%"><thead><tr><th class="type-caption-upper" style="text-align:left;padding:9px 10px;border-bottom:1px solid var(--border-strong)">Модуль</th><th class="type-caption-upper" style="text-align:left;padding:9px 10px;border-bottom:1px solid var(--border-strong)">Назначение</th><th class="type-caption-upper" style="text-align:left;padding:9px 10px;border-bottom:1px solid var(--border-strong)">Состояние</th></tr></thead>
<tbody><sc-for list="{{ modules }}" as="mo" hint-placeholder-count="3">
<tr><td class="type-body-sm" style="padding:12px 10px;border-bottom:1px solid var(--border-default)">{{ mo.name }}</td><td class="type-body-sm" style="padding:12px 10px;border-bottom:1px solid var(--border-default)">{{ mo.purpose }}</td><td style="padding:12px 10px;border-bottom:1px solid var(--border-default)"><x-import component-from-global-scope="ExpoStyleDashboardDesignSystem_2956c4.Badge" variant="warning" hint-size="auto,22px">Ожидается подтверждение</x-import></td></tr>
</sc-for></tbody></table>
<h3 class="type-title-sm" style="margin:22px 0 12px">Связанные инициативы</h3>
<sc-if value="{{ hasProposals }}" hint-placeholder-val="{{ false }}">
<table style="width:100%"><thead><tr><th class="type-caption-upper" style="text-align:left;padding:9px 10px;border-bottom:1px solid var(--border-strong)">Предложение</th><th class="type-caption-upper" style="text-align:left;padding:9px 10px;border-bottom:1px solid var(--border-strong)">Плановый год</th><th class="type-caption-upper" style="text-align:left;padding:9px 10px;border-bottom:1px solid var(--border-strong)">Статус</th></tr></thead>
<tbody><sc-for list="{{ proposals }}" as="p" hint-placeholder-count="2">
<tr><td style="padding:12px 10px;border-bottom:1px solid var(--border-default)"><button onClick="{{ p.onOpen }}" style="background:transparent;border:none;padding:0;color:var(--text-link);cursor:pointer;font:inherit">{{ p.title }}</button></td><td class="type-body-sm" style="padding:12px 10px;border-bottom:1px solid var(--border-default)">{{ p.year }}</td><td style="padding:12px 10px;border-bottom:1px solid var(--border-default)"><x-import component-from-global-scope="ExpoStyleDashboardDesignSystem_2956c4.Badge" variant="{{ p.statusVariant }}" hint-size="auto,22px">{{ p.status }}</x-import></td></tr>
</sc-for></tbody></table>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;modules&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;any&quot;},&quot;hasProposals&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;any&quot;},&quot;proposals&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;any&quot;}}"></script>
</body>
</html>
